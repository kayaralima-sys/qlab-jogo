<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q-LAB | Teste Canva incorporado</title><style>*{box-sizing:border-box}body{margin:0;background:#06152c;color:#fff;font-family:Arial,sans-serif}header{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#0d2545}h1{font-size:19px;margin:0}p{margin:5px 0;font-size:13px;color:#d1e5ff}.actions{display:flex;gap:9px;flex-wrap:wrap}button,a.action{background:#ffcb34;color:#15243a;border:0;border-radius:9px;padding:11px 13px;font-weight:bold;cursor:pointer;text-decoration:none;font-size:14px}button.secondary{background:#2164a6;color:#fff}main{height:calc(100dvh - 91px);min-height:450px}iframe{width:100%;height:100%;border:0;background:white}.note{position:fixed;bottom:12px;left:12px;background:#071c35dd;padding:9px 12px;border-radius:8px;font-size:12px;pointer-events:none}</style></head><body><header><div><h1>⚗️ Q-LAB — Teste do jogo Canva</h1><p>Versão independente para testar botões, QR Codes e navegação originais.</p></div><div class="actions"><button id="music">🎵 Ativar música</button><button class="secondary" id="mute">🔇 Silenciar</button><a class="action" href="https://owl-qfrt91.my.canva.site/" target="_blank" rel="noopener">Abrir Canva diretamente</a></div></header><main><iframe title="Q-LAB — jogo original do Canva" src="https://owl-qfrt91.my.canva.site/" allow="fullscreen; autoplay" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></main><div class="note">Teste separado: não substitui o Q-LAB atual no GitHub.</div><audio id="bg" src="https://kayaralima-sys.github.io/qlab-jogo/aventura_espacial.mp3" loop preload="none"></audio><script>const audio=document.getElementById('bg');audio.volume=.25;document.getElementById('music').onclick=async()=>{try{await audio.play();document.getElementById('music').textContent='🎵 Música ligada'}catch(e){alert('Não
