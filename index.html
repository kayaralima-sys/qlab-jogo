<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q-LAB — Exploradores da Química</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08172c;color:white;font-family:Arial,Helvetica,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:#102c4d}h1{font-size:clamp(18px,2.5vw,26px);margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}a.button{display:inline-block;padding:12px 16px;background:#ffdf57;color:#102039;border-radius:10px;text-decoration:none;font-weight:700}a.button.secondary{background:#d7e9ff}main{max-width:1600px;margin:auto;padding:12px}.embed{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#e5e7eb}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}footer{text-align:center;padding:10px 20px;color:#c9d9ec;font-size:14px}footer a{color:#ffdf57}
</style>
</head>
<body>
  <!-- MÚSICA DE AVENTURA DO Q-LAB -->
<audio id="musicaQlab" loop preload="auto">
  <source src="aventura-espacial.mp3" type="audio/mpeg">
</audio>

<div style="position:fixed;bottom:15px;right:15px;
z-index:99999;background:#102344;color:white;
padding:12px;border-radius:15px;">
  <button onclick="document.getElementById('musicaQlab').play()">
    🎵 Música
  </button>
  <button onclick="document.getElementById('musicaQlab').pause()">
    ⏸ Pausar
  </button>
  <input type="range" min="0" max="100" value="20"
    aria-label="Volume da música"
    oninput="document.getElementById('musicaQlab').volume=this.value/100">
</div>

<script>
  document.getElementById('musicaQlab').volume = 0.2;
</script>
<header><h1>🧪 Q-LAB — Exploradores da Química</h1><div class="actions"><a class="button" href="https://www.canva.com/design/DAHUC9WUlNc/JmnV3rOveZdW-_ZnzrWwRQ/view" target="_blank" rel="noopener noreferrer">Abrir jogo em tela inteira ↗</a><a class="button secondary" href="https://owl-qfrt91.my.canva.site/" target="_blank" rel="noopener noreferrer">Abrir site original ↗</a></div></header>
<main><div class="embed"><iframe title="Q-LAB — jogo original do Canva" loading="eager" src="https://www.canva.com/design/DAHUC9WUlNc/JmnV3rOveZdW-_ZnzrWwRQ/view?embed" allowfullscreen allow="fullscreen"></iframe></div></main>
<footer>Jogo original incorporado pelo código oficial do Canva. Se não carregar, use <a href="https://www.canva.com/design/DAHUC9WUlNc/JmnV3rOveZdW-_ZnzrWwRQ/view" target="_blank" rel="noopener noreferrer">Abrir jogo em tela inteira</a>.</footer>
  
<div style="position:fixed; top:90px; right:20px; z-index:9999; padding:8px;">

  <button id="botao-audio"
    onclick="alternarAudio()"
    style="background:#0878d1;color:white;border:0;
    border-radius:12px;padding:14px 22px;
    font-size:18px;cursor:pointer;">
    🔊 Ouvir audiodescrição — Tela 1
  </button>

  <audio id="audio-tela-1" preload="none">
    <source src="tela01_narradora.mp3(1).mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  const audio = document.getElementById("audio-tela-1");
  const botao = document.getElementById("botao-audio");

  function alternarAudio() {
    if (audio.paused) {
      audio.play().catch(() => {
        alert("Não foi possível reproduzir o áudio.");
      });
    } else {
      audio.pause();
    }
  }

  audio.addEventListener("play", () => {
    botao.textContent = "⏸️ Pausar audiodescrição";
  });

  audio.addEventListener("pause", () => {
    botao.textContent = "🔊 Ouvir audiodescrição — Tela 1";
  });
</script>

</body>
</html>
