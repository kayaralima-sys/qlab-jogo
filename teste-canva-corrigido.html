<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Q-LAB | Teste de incorporação oficial Canva</title><style>*{box-sizing:border-box}body{margin:0;background:#07152b;color:white;font-family:Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#102b4a;flex-wrap:wrap}button,a.action{background:#ffc629;color:#13233d;border:0;border-radius:8px;padding:10px 15px;font-weight:bold;cursor:pointer;text-decoration:none}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.viewer{width:100%;aspect-ratio:16/9;position:relative}.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}small{color:#c8d8ee}#status{font-size:12px}</style></head><body><header><div><strong>⚛️ Q-LAB — Teste de incorporação oficial do Canva</strong><div><small>Teste separado: não modifica o jogo publicado.</small></div></div><div class="controls"><button id="music">🎵 Ativar música</button><button id="mute">🔇 Silenciar</button><a class="action" target="_blank" rel="noopener" href="https://www.canva.com/design/DAHUC9WUlNc/JmnV3rOveZdW-_ZnzrWwRQ/view">Abrir no Canva</a></div></header><main class="viewer"><iframe src="https://www.canva.com/design/DAHUC9WUlNc/JmnV3rOveZdW-_ZnzrWwRQ/view?embed" allow="fullscreen" allowfullscreen title="Jogo Q-LAB no Canva"></iframe></main><audio id="bg" src="aventura_espacial.mp3" loop preload="none"></audio><div id="status" role="status" style="padding:10px 18px">Clique em Ativar música para ouvir a trilha sonora. A incorporação usa o código oficial fornecido pelo Canva.</div><script>const bg=document.getElementById('bg'),status=document.getElementById('status'),music=document.getElementById('music');bg.volume=.22;music.onclick=async()=>{if(bg.paused){try{await bg.play();music.textContent='⏸️ Pausar música';status.textContent='Música ativada.'}catch(e){status.textContent='Não foi possível tocar a música. Verifique se aventura_espacial.mp3 está na mesma pasta.'}}else{bg.pause();music.textContent='🎵 Ativar música'}};document.getElementById('mute').onclick=()=>{bg.muted=!bg.muted;document.getElementById('mute').textContent=bg.muted?'🔊 Restaurar som':'🔇 Silenciar'};</script></body></html>
