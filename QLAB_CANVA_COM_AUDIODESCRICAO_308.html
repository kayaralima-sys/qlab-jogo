<script>
const falas = {"7":[["n","Tela 7. Átomo. Laboratório futurista azul, com o QBot à esquerda. No centro, um modelo de átomo apresenta núcleo com esferas vermelhas e azuis e elétrons azuis ao redor. Há um código QR e o botão Ver em RA. O que é? Unidade básica que constitui os elementos químicos. Estrutura: possui um núcleo formado por prótons e nêutrons e uma região eletrônica associada aos elétrons, a eletrosfera. Qual é sua função? Forma a matéria e determina propriedades químicas dos elementos, como reatividade, tamanho e massa. Explore: toque nas partes do modelo para conhecer prótons, nêutrons e elétrons. Você também pode visualizar o átomo em três dimensões, realidade aumentada e realidade virtual."],["q","Este é o átomo! Vamos conhecer sua estrutura e descobrir como ele é fundamental na Química."],["n","No painel de representação aparecem próton, com carga positiva; nêutron, sem carga elétrica; e elétron, com carga negativa. Controles: início, áudio, continuar, Ver em RA e próximo."]],"8":[["n","Tela 8. Próton. O laboratório futurista azul apresenta o QBot à esquerda. Sobre uma plataforma iluminada, uma esfera vermelha com sinal positivo representa o próton. Ao lado, um código QR permite acessar a realidade aumentada. O que é? Partícula subatômica com carga elétrica positiva que faz parte do núcleo do átomo. Onde está? No núcleo, junto com os nêutrons. Qual é sua função? Determina o número atômico do elemento químico e contribui para a massa do átomo."],["q","Este é o próton! Vamos conhecer suas características e descobrir como ele é fundamental na Química."],["n","Características: carga positiva mais um; massa aproximadamente uma unidade de massa atômica; símbolo p mais; localização no núcleo do átomo. Controles: início, áudio, continuar, Ver em RA, anterior e próximo."]],"9":[["n","Tela 9. Nêutron. Laboratório futurista com iluminação azul. No centro-esquerda, esferas azuis, cinzas e brancas agrupadas representam o modelo. O QBot aparece à esquerda e há um código QR para realidade aumentada. O que é? Partícula subatômica sem carga elétrica que faz parte do núcleo do átomo. Onde está? No núcleo, junto com os prótons. Qual é sua função? Contribui para a estabilidade do núcleo e para a massa do átomo. A quantidade de nêutrons pode variar, originando isótopos de um mesmo elemento."],["q","Este é o nêutron! Vamos conhecer suas características e descobrir como ele é fundamental na Química."],["n","Características: carga elétrica zero, neutra; massa aproximadamente uma unidade de massa atômica; símbolo n zero; localização no núcleo. Controles: início, áudio, continuar, Ver em RA, anterior e próximo."]],"10":[["n","Tela 10. Elétron. O laboratório futurista azul mostra o QBot à esquerda e um modelo atômico com pequenas esferas azuis ao redor de um núcleo vermelho e azul. Há um código QR para realidade aumentada. O que é? Partícula subatômica com carga elétrica negativa, associada à região eletrônica do átomo. Onde está? Na eletrosfera, em níveis e subníveis de energia. Qual é sua função? Está relacionada às ligações químicas e a propriedades como reatividade e condutividade elétrica."],["q","Este é o elétron! Vamos conhecer suas características e descobrir como ele é fundamental na Química."],["n","Características: carga elétrica menos um; massa aproximadamente zero vírgula zero zero zero cinco cinco unidade de massa atômica; símbolo e menos; localização na eletrosfera. Controles: início, áudio, continuar, Ver em RA, anterior e próximo."]],"2":[["n","Tela 2. Álbum Químico. A tela mostra um laboratório futurista em tons de azul escuro, com iluminação azul neon, vidrarias e frascos com líquidos coloridos nas laterais. No alto à esquerda estão o botão de início, com desenho de casa, e o ícone de alto-falante. Ao centro está o logotipo Q-LAB. No alto à direita, o botão amarelo CONTINUAR, com seta para a direita. Abaixo do logotipo aparece o título ÁLBUM QUÍMICO, acompanhado do desenho de um livro aberto com frasco de laboratório. Abaixo, a frase: EXPLORE OS EQUIPAMENTOS, CONCEITOS E FENÔMENOS DA QUÍMICA."],["q","AQUI VOCÊ ENCONTRA TODOS OS ITENS E CONCEITOS DO Q LAB! ESCOLHA UMA CATEGORIA PARA EXPLORAR."],["n","O QBot aparece no canto inferior esquerdo. É um robô branco e azul, com rosto digital escuro, olhos azuis sorridentes e símbolo de átomo no peito. Ele segura um frasco com líquido azul e aponta para as opções. Seu balão de fala é branco, com letras pretas."],["n","No centro, cinco cartões grandes e coloridos apresentam as categorias do álbum. Na primeira linha, à esquerda, um cartão amarelo e laranja mostra tubo de ensaio, béquer e Erlenmeyer com líquidos coloridos. Seu título é EQUIPAMENTOS DE LABORATÓRIO. Ao lado, um cartão azul mostra um modelo de átomo e traz o título ESTRUTURA DA MATÉRIA. À direita, um cartão roxo mostra esferas conectadas representando moléculas, com o título LIGAÇÕES E MOLÉCULAS."],["n","Na segunda linha, um cartão verde mostra partículas em uma colisão com brilho amarelo no centro. Seu título é REAÇÕES E CINÉTICA QUÍMICA. Ao lado, um cartão rosa mostra um gráfico com curva de energia, setas e partículas coloridas. Seu título é FATORES QUE INFLUENCIAM AS REAÇÕES. Cada cartão tem um botão circular azul com seta branca para a direita."],["n","Para explorar, escolha a categoria desejada e selecione a seta correspondente. O botão com a casa leva à página inicial. O alto-falante identifica o recurso de áudio na imagem do jogo. O botão CONTINUAR permite avançar. Fim da audiodescrição da Tela 2."]],"3":[["n","Tela 3. Equipamentos de Laboratório. Ambiente de laboratório futurista azul, com luzes neon e frascos coloridos nas laterais. No alto, logotipo Q-LAB e faixa amarela com o título EQUIPAMENTOS DE LABORATÓRIO. Abaixo, o subtítulo EXPLORE OS PRINCIPAIS EQUIPAMENTOS UTILIZADOS NA QUÍMICA. À esquerda estão os botões de início, em forma de casa, e de som. À direita, o botão amarelo CONTINUAR."],["q","Escolha um equipamento para explorar e descubra sua função no laboratório!"],["n","O QBot aparece à esquerda, sorridente, com corpo branco e azul, rosto preto com olhos azuis luminosos, símbolo de átomo no peito e um frasco de líquido azul na mão. Três cartões verticais apresentam equipamentos. O primeiro, à esquerda, mostra um tubo de ensaio de vidro inclinado com líquido azul. O título é Tubo de ensaio, e abaixo há um botão amarelo EXPLORAR com seta azul. O segundo cartão, no centro, mostra uma balança digital de laboratório, com visor e prato metálico. O título é Balança e o botão EXPLORAR é azul. O terceiro cartão, à direita, mostra um microscópio branco e preto com oculares, objetivas e base. O título é Microscópio e o botão EXPLORAR é amarelo."],["n","Para conhecer cada equipamento, selecione seu cartão ou o botão EXPLORAR correspondente. A casa volta ao início. O botão CONTINUAR fica no alto à direita. Fim da Tela 3."]],"4":[["n","Tela 4. Tubo de ensaio. O fundo é um laboratório futurista azul, com vidrarias, luzes neon e uma plataforma circular iluminada no centro. No alto está o logotipo Q-LAB, e uma faixa amarela exibe o título TUBO DE ENSAIO, com um pequeno ícone de tubo. À esquerda ficam os botões de casa e alto-falante; no alto à direita, o botão amarelo CONTINUAR."],["q","Este é o tubo de ensaio! Vamos conhecer suas características e descobrir como ele é utilizado na Química."],["n","O QBot está no canto inferior esquerdo, branco e azul, sorridente, segurando um frasco de líquido azul. Sobre a plataforma aparece um tubo de ensaio transparente, alto, com fundo arredondado e líquido azul até aproximadamente a metade, com pequenas bolhas. Ao lado do tubo está um código QR preto e branco com a identificação Q-LAB e Tubo de Ensaio. Abaixo do código QR há um botão rosa VER EM RA, com ícone de celular."],["n","À direita estão quatro cartões de informação. Primeiro, em azul: O QUE É? Recipiente cilíndrico, geralmente feito de vidro, com fundo arredondado e abertura superior, utilizado em diferentes procedimentos experimentais e laboratoriais. Segundo, em verde: PARA QUE SERVE? É utilizado para conter, misturar, aquecer pequenas quantidades de substâncias, realizar reações e observar transformações químicas. Terceiro, em roxo: COMO UTILIZAR? Coloque a substância dentro do tubo de ensaio, manipule-o com cuidado e, se for aquecer, utilize um suporte adequado. Ao aquecer, mantenha a abertura direcionada para longe de pessoas. Quarto, em laranja: ATENÇÃO! Não deve ser aquecido diretamente com as mãos. Utilize um suporte, como pinça ou garra. Resiste a variações de temperatura, mas pode quebrar se sofrer choques térmicos ou impactos."],["n","Na parte inferior, um botão azul PRÓXIMO com seta para a direita permite avançar. O QR Code e o botão VER EM RA oferecem acesso ao modelo em realidade aumentada. Fim da Tela 4."]],"5":[["n","Tela 5. Balança. Laboratório futurista azul, com iluminação neon, bancadas e vidrarias. No alto está o logotipo Q-LAB e, abaixo, uma faixa amarela com o título BALANÇA e um pequeno desenho do equipamento. À esquerda, os ícones de casa e som. À direita, o botão amarelo CONTINUAR."],["q","Esta é a balança! Vamos conhecer suas características e descobrir como ela é utilizada na Química."],["n","O QBot aparece na parte inferior esquerda. No centro há uma balança digital de laboratório sobre uma plataforma circular azul iluminada. Ela possui prato redondo metálico, corpo cinza claro, visor digital e botões de controle. Ao lado há um grande código QR preto e branco. Abaixo dele está o botão rosa VER EM RA, com ícone de celular."],["n","À direita há quatro cartões informativos. O primeiro, azul, tem o título O QUE É? Instrumento de medição utilizado para determinar a massa de substâncias, com alta precisão. Existem diferentes tipos de balanças, como a analítica e a semianalítica. O segundo, verde, PARA QUE SERVE? É utilizada para medir a massa de sólidos, líquidos ou recipientes, sendo essencial para pesagens de soluções e experimentos químicos. O terceiro, roxo, COMO UTILIZAR? Coloque a balança em superfície nivelada, verifique se está calibrada, faça a tara, isto é, zere o recipiente, posicione a amostra e aguarde a estabilização do valor indicado antes de registrar a massa desejada. O quarto, laranja, ATENÇÃO! Mantenha a balança limpa e seca. Não ultrapasse o limite de capacidade. Evite colocar substâncias quentes ou corrosivas. Utilize recipientes adequados."],["n","Na parte inferior estão dois botões azuis: ANTERIOR, com seta à esquerda, e PRÓXIMO, com seta à direita. O QR Code e o botão VER EM RA permitem explorar o modelo tridimensional. Fim da Tela 5."]],"6":[["n","Tela 6. Microscópio. A tela mostra um laboratório futurista azul-escuro, com iluminação azul neon, vidrarias e bancadas. No alto está o logotipo Q-LAB e uma faixa amarela com o título MICROSCÓPIO, acompanhada de um pequeno desenho do equipamento. No canto superior esquerdo estão os botões de início e som; no canto superior direito, o botão amarelo CONTINUAR."],["q","Este é o microscópio! Vamos conhecer suas características e descobrir como ele é utilizado na Química."],["n","O QBot aparece sorridente à esquerda, segurando um frasco com líquido azul. Sobre a plataforma circular iluminada está um microscópio óptico branco e preto, com oculares inclinadas, lentes objetivas, platina e base. Ao lado aparece um código QR preto e branco. Abaixo dele há um botão rosa VER EM RA com símbolo de celular."],["n","À direita aparecem quatro cartões. No primeiro, azul, O QUE É? Instrumento óptico utilizado para ampliar a imagem de objetos muito pequenos, permitindo a observação de estruturas que não são visíveis a olho nu. No segundo, verde, PARA QUE SERVE? É utilizado para observar células, cristais, partículas, estruturas de materiais e precipitados, sendo importante em análises e pesquisas em diversas áreas da ciência. No terceiro, roxo, COMO UTILIZAR? Coloque a lâmina na platina, selecione a objetiva de menor aumento, ajuste o foco com o parafuso macrométrico e, se necessário, utilize o parafuso micrométrico para melhor nitidez. No quarto, laranja, ATENÇÃO! Manuseie as lâminas com cuidado. Não toque diretamente nas lentes. Mantenha o equipamento limpo e coberto quando não estiver em uso."],["n","Na parte inferior esquerda está o botão azul ANTERIOR, com seta para a esquerda. O QR Code e o botão VER EM RA permitem visualizar o microscópio em realidade aumentada. Fim da Tela 6."]],"11":[["n","Tela 11. Núcleo. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título NÚCLEO. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um núcleo atômico composto por esferas vermelhas e azuis, em uma estrutura circular azulada."],["q","Vamos explorar núcleo e descobrir sua importância na Química!"],["n","O núcleo é a região central do átomo, formada por prótons e nêutrons. Concentra quase toda a massa do átomo. A quantidade de prótons identifica o elemento químico."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"12":[["n","Tela 12. Eletrosfera. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título ELETROSFERA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um átomo ilustrado, com núcleo central e região ao redor destacando a eletrosfera."],["q","Vamos explorar eletrosfera e descobrir sua importância na Química!"],["n","A eletrosfera é a região do átomo associada aos elétrons. Os elétrons ocupam estados de energia e participam das ligações químicas."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"13":[["n","Tela 13. Oxigênio (O). A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título OXIGÊNIO (O). À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um modelo atômico do oxigênio e, à direita, o símbolo O em um quadro de elemento químico."],["q","Vamos explorar oxigênio (o) e descobrir sua importância na Química!"],["n","O oxigênio tem símbolo O e número atômico 8. Um átomo neutro de oxigênio tem oito prótons e oito elétrons. O oxigênio participa da formação da água e de muitas outras substâncias."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"14":[["n","Tela 14. Molécula. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título MOLÉCULA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um modelo tridimensional de molécula de água, com uma esfera vermelha para o oxigênio e duas menores para os hidrogênios."],["q","Vamos explorar molécula e descobrir sua importância na Química!"],["n","Uma molécula é formada por átomos unidos por ligações químicas. A água, H dois O, é um exemplo: dois átomos de hidrogênio ligados a um átomo de oxigênio."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"15":[["n","Tela 15. Ligação Iônica. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título LIGAÇÃO IÔNICA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece modelos de partículas representando transferência de elétrons e atração entre íons de cargas opostas."],["q","Vamos explorar ligação iônica e descobrir sua importância na Química!"],["n","A ligação iônica envolve a formação de íons de cargas opostas e a atração eletrostática entre eles. É comum em compostos formados por metais e ametais."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"16":[["n","Tela 16. Ligação Covalente. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título LIGAÇÃO COVALENTE. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece uma molécula de água ilustrada com ligações entre oxigênio e hidrogênio."],["q","Vamos explorar ligação covalente e descobrir sua importância na Química!"],["n","Na ligação covalente, os átomos compartilham pares de elétrons. A molécula de água apresenta ligações covalentes entre oxigênio e hidrogênio."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"17":[["n","Tela 17. Ligação Metálica. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título LIGAÇÃO METÁLICA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um arranjo de muitas esferas representando átomos em um sólido metálico."],["q","Vamos explorar ligação metálica e descobrir sua importância na Química!"],["n","A ligação metálica mantém os átomos unidos em materiais metálicos. Os elétrons podem se deslocar pelo material, contribuindo para a condução elétrica."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"18":[["n","Tela 18. Íons. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título ÍONS. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece duas representações de partículas carregadas, uma positiva e outra negativa."],["q","Vamos explorar íons e descobrir sua importância na Química!"],["n","Íons são átomos ou grupos de átomos com carga elétrica. Cátions têm carga positiva; ânions têm carga negativa. Eles se formam por perda ou ganho de elétrons."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"19":[["n","Tela 19. Reação Química. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título REAÇÃO QUÍMICA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece esquemas de moléculas antes e depois de uma reação química, com fórmulas e setas."],["q","Vamos explorar reação química e descobrir sua importância na Química!"],["n","Uma reação química transforma reagentes em produtos por reorganização de átomos e ligações. A matéria é conservada quando a equação está corretamente balanceada."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"20":[["n","Tela 20. Reagentes e Produtos. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título REAGENTES E PRODUTOS. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um esquema de reagentes e produtos, com moléculas representadas por esferas coloridas e uma seta indicando a transformação."],["q","Vamos explorar reagentes e produtos e descobrir sua importância na Química!"],["n","Reagentes são as substâncias iniciais de uma reação. Produtos são as substâncias formadas. A seta da equação química indica o sentido da transformação representada."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"21":[["n","Tela 21. Colisão Efetiva. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título COLISÃO EFETIVA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece uma sequência ilustrada de moléculas colidindo e formando produtos."],["q","Vamos explorar colisão efetiva e descobrir sua importância na Química!"],["n","Uma colisão efetiva ocorre quando partículas se encontram com orientação adequada e energia suficiente para reagir, possibilitando a formação de produtos."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"22":[["n","Tela 22. Colisão Não Efetiva. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título COLISÃO NÃO EFETIVA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece sequências de partículas que colidem sem produzir a transformação desejada."],["q","Vamos explorar colisão não efetiva e descobrir sua importância na Química!"],["n","Nem toda colisão entre partículas gera reação. Se faltar energia suficiente ou orientação adequada, a colisão é não efetiva."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"23":[["n","Tela 23. Energia de Ativação. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título ENERGIA DE ATIVAÇÃO. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um gráfico com curva de energia, pico de ativação e indicação da barreira energética."],["q","Vamos explorar energia de ativação e descobrir sua importância na Química!"],["n","A energia de ativação é a barreira energética que precisa ser superada para que uma reação ocorra. No gráfico, ela está relacionada à diferença de energia até o pico."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"24":[["n","Tela 24. Estado de Transição. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título ESTADO DE TRANSIÇÃO. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um gráfico de energia com o ponto de maior energia e um modelo molecular do estado de transição."],["q","Vamos explorar estado de transição e descobrir sua importância na Química!"],["n","O estado de transição é uma configuração instável de alta energia durante a transformação de reagentes em produtos. É representado perto do topo do perfil energético."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"25":[["n","Tela 25. Perfil Energético. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título PERFIL ENERGÉTICO. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece um gráfico de energia ao longo do caminho da reação, com reagentes, produtos e pico."],["q","Vamos explorar perfil energético e descobrir sua importância na Química!"],["n","O perfil energético representa a variação de energia ao longo de uma reação. Permite comparar a energia de reagentes e produtos e identificar a barreira de ativação."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"26":[["n","Tela 26. Temperatura. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título TEMPERATURA. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece dois quadros com partículas em movimento, comparando situações de temperaturas diferentes."],["q","Vamos explorar temperatura e descobrir sua importância na Química!"],["n","A temperatura influencia a energia cinética e a frequência de colisões efetivas entre partículas. Em muitas reações, o aumento da temperatura eleva a velocidade da reação."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"27":[["n","Tela 27. Concentração. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título CONCENTRAÇÃO. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece dois quadros com quantidades diferentes de partículas no mesmo espaço, comparando concentrações."],["q","Vamos explorar concentração e descobrir sua importância na Química!"],["n","A concentração indica a quantidade de uma espécie química em determinado volume. Em muitas reações, maior concentração favorece mais encontros entre partículas."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"28":[["n","Tela 28. Superfície de Contato. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título SUPERFÍCIE DE CONTATO. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece três quadros com materiais em diferentes estados de divisão, ilustrando a área de contato."],["q","Vamos explorar superfície de contato e descobrir sua importância na Química!"],["n","A superfície de contato exposta influencia a velocidade de certas reações. Um sólido dividido em pedaços menores costuma oferecer maior área de contato do que um bloco inteiro."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"29":[["n","Tela 29. Catalisador. A tela tem o cenário de laboratório futurista azul escuro com iluminação neon. No alto aparecem o logotipo Q-LAB e o título CATALISADOR. À esquerda, o robô QBot apresenta o conteúdo. Na região central aparece esquemas de reação e curvas de energia, comparando processos com e sem catalisador."],["q","Vamos explorar catalisador e descobrir sua importância na Química!"],["n","Um catalisador oferece um caminho de reação com menor energia de ativação, acelerando a transformação sem ser consumido globalmente no processo."],["n","A tela contém quadros informativos coloridos e um painel de representação visual. Há um QR Code para explorar o conteúdo em realidade aumentada e, próximo dele, um botão de acesso à RA. Os botões de início e áudio ficam no canto superior esquerdo. O botão CONTINUAR aparece no canto superior direito. Na parte inferior há controles de navegação, incluindo ANTERIOR e PRÓXIMO quando exibidos. Observe as legendas e os detalhes do modelo na tela antes de avançar."]],"30":[["n","Tela 30. Sobre o Q-LAB. O laboratório futurista ocupa o fundo. À esquerda aparece uma cientista ilustrada, de jaleco branco, segurando um frasco, diante do grande logotipo Q-LAB. À direita estão vários cartões coloridos com informações sobre o projeto, sua proposta educativa, objetivos, metodologia, acessibilidade e recursos de aprendizagem."],["n","Os quadros apresentam ícones de ciência, alvo, pessoas, livros e acessibilidade. No canto superior esquerdo há casa e alto-falante. No canto superior direito, CONTINUAR. Esta é uma tela de apresentação do projeto, diferente das anteriores com QR Code de modelo químico."]],"31":[["n","Tela 31. Bem-vindo ao Q-LAB. À esquerda está o QBot, robô branco e azul, sorridente, com uma das mãos levantadas. À direita, um grande quadro branco traz o título BEM-VINDO AO Q-LAB! e mensagens de recepção ao explorador. O laboratório futurista azul aparece ao fundo."],["q","Olá, cientista! Eu sou o QBot. Vou acompanhar você em todas as suas descobertas no Q-LAB."],["n","O quadro convida a explorar o laboratório e seguir experiências, missões e desafios. Um grande botão amarelo CONTINUAR fica à direita. No alto à esquerda estão os ícones de início e som."]],"32":[["n","Tela 32. Como você quer explorar o Q-LAB? O QBot aparece grande à esquerda, segurando um dispositivo. Ao centro, o logotipo Q-LAB ocupa o alto da tela. Um grande balão de fala branco com borda azul pergunta: COMO VOCÊ QUER EXPLORAR O Q-LAB? O cenário é o mesmo laboratório futurista, com vidrarias e moléculas luminosas."],["q","Como você quer explorar o Q-LAB?"],["n","Esta tela introduz a escolha de uma forma de exploração. Use a navegação visível no jogo para prosseguir."]],"33":[["n","Tela 33. Identificação do Explorador. Sob o logotipo Q-LAB, o título IDENTIFICAÇÃO DO EXPLORADOR orienta a escolher um personagem. Sete cartões verticais coloridos mostram avatares de cientistas. Da esquerda para a direita: Lia, Kauê, Luna, Téo, Caio, Manu e Luz. Cada cartão tem uma cor e uma ilustração própria."],["q","Escolha um explorador para começar sua aventura científica!"],["n","À esquerda aparecem os ícones de casa e áudio. À direita há uma ilustração de cartão de identificação. O botão CONTINUAR fica no canto superior direito. Selecione o personagem desejado para conhecer sua carteira."]],"34":[["n","Tela 34. Carteira do Cientista, personagem Lia. O laboratório azul futurista aparece ao fundo. À esquerda, o QBot fica ao lado de um botão VOLTAR. Ao centro está um cartão azul com o título CARTEIRA DO CIENTISTA e uma faixa de identificação. A imagem mostra uma jovem cientista de cabelos escuros compridos, com jaleco branco e roupa rosa."],["n","No cartão aparece o nome Lia, acompanhado de informações e indicadores de progresso do explorador, com símbolos de estrelas e linhas de atributos. À direita há um QR Code preto e branco e um botão de visualização. Os ícones de início e som aparecem no alto. O botão VOLTAR permite retornar à seleção de personagens."]],"35":[["n","Tela 35. Carteira do Cientista, personagem Kauê. O laboratório azul futurista aparece ao fundo. À esquerda, o QBot fica ao lado de um botão VOLTAR. Ao centro está um cartão azul com o título CARTEIRA DO CIENTISTA e uma faixa de identificação. A imagem mostra um jovem cientista de pele escura, óculos escuros e roupa azul."],["n","No cartão aparece o nome Kauê, acompanhado de informações e indicadores de progresso do explorador, com símbolos de estrelas e linhas de atributos. À direita há um QR Code preto e branco e um botão de visualiza function restaurarMusica(){musica.volume=Number(document.getElementById('volume').value)/100}

function vozPt(){const v=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('pt-br'));return v.find(v=>/female|maria|francisca|luciana|helena/i.test(v.name))||v[0]||speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('pt'))||null}
function falarPartes(partes,token,i=0){if(!ativo||token!==fila)return;if(i>=partes.length){ativo=false;restaurarMusica();mensagem('Audiodescrição concluída.');document.getElementById('ouvir').textContent='🔊 Ouvir';return}const [tipo,txt]=partes[i];const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.voice=vozPt();u.rate=tipo==='q'?.93:.96;u.pitch=tipo==='q'?.68:1.1;u.volume=1;u.onend=()=>falarPartes(partes,token,i+1);u.onerror=e=>{if(token===fila){parar();mensagem('Não foi possível reproduzir a voz. Verifique as vozes em português do navegador.')}};mensagem(tipo==='q'?'🤖 QBot falando...':'🎙️ Narradora falando...');speechSynthesis.speak(u)}
function ouvir(){if(ativo){parar();mensagem('Audiodescrição interrompida.');return}const n=Number(seletor.value);ativo=true;fila++;const token=fila;musica.volume=Math.min(musica.volume,.07);document.getElementById('ouvir').textContent='⏸ Interromper';if(n===1){mp3.currentTime=0;mp3.play().then(()=>mensagem('🎙️ Reproduzindo áudio da Tela 1...')).catch(()=>{parar();mensagem('Arquivo tela01_narradora.mp3(1).mp3 não encontrado ou reprodução bloqueada. Confira o nome no GitHub.')});return}if(!('speechSynthesis' in window)){parar();mensagem('Este navegador não oferece síntese de voz. Experimente Chrome ou Edge.');return}speechSynthesis.cancel();falarPartes(falas[n],token)}
